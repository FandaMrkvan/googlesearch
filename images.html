<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Images</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <nav aria-label="Google search pages">
      <a href="index.html">Google Search</a>
      <a href="advanced.html">Advanced Search</a>
    </nav>
  </header>

  <main class="home image-home">
    <h1 class="google-logo" aria-label="Google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></h1>
    <span class="image-label">Images</span>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input type="hidden" name="tbm" value="isch">
      <label class="sr-only" for="image-query">Search images</label>
      <input class="search-box" id="image-query" type="text" name="q" autocomplete="off" autofocus>
      <div class="search-buttons">
        <input type="submit" value="Google Image Search">
      </div>
    </form>
  </main>
</body>
</html>
