<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokročilé vyhledávání</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="mini-logo" href="index.html" aria-label="Google Search"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></a>
    <nav aria-label="Google Search">
      <a href="index.html">Google Search</a>
    </nav>
  </header>

  <main class="advanced-page">
    <h1>Pokročilé vyhledávání</h1>
    <div class="rule"></div>
    <h2>Najdi stránky s…</h2>
    <form action="https://www.google.com/search" method="get">
      <div class="advanced-row">
        <label for="all-words">všechna tato slova:</label>
        <input id="all-words" type="text" name="as_q">
      </div>
      <div class="advanced-row">
        <label for="exact-words">toto přesné slovo nebo fráze:</label>
        <input id="exact-words" type="text" name="as_epq">
      </div>
      <div class="advanced-row">
        <label for="any-words">některá z těchto slov:</label>
        <input id="any-words" type="text" name="as_oq">
      </div>
      <div class="advanced-row">
        <label for="none-words">žádná z těchto slov:</label>
        <input id="none-words" type="text" name="as_eq">
      </div>
      <div class="advanced-submit">
        <input type="submit" value="Pokročilé vyhledávání">
      </div>
    </form>
  </main>
</body>
</html>
