<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <nav aria-label="Další typy vyhledávání">
      <a href="images.html">Obrázky</a>
      <a href="advanced.html">Pokročilé vyhledávání</a>
    </nav>
  </header>

  <main class="home">
    <h1 class="google-logo" aria-label="Google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></h1>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <label class="sr-only" for="query">Hledat</label>
      <input class="search-box" id="query" type="text" name="q" autocomplete="off" autofocus>
      <div class="search-buttons">
        <input type="submit" value="Google Search">
        <button type="submit" name="btnI" value="1">Zkusím štěstí</button>
      </div>
    </form>
  </main>
  <footer class="site-footer">
    <a href="citace.html">Citace a zdroje</a>
    <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Ffandamrkvan.github.io%2Fgooglesearch%2Findex.html">Validovat HTML</a>
    <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Ffandamrkvan.github.io%2Fgooglesearch%2Fstyles.css">Validovat CSS</a>
  </footer>
</body>
</html>
